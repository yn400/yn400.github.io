<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>vlovem · 山川湖海</title>
<meta name="description" content="一个懒懒的小角落:喜欢山川湖海,遨游四海。">
<!--
  背景照片均来自 Wikimedia Commons,CC BY-SA 4.0(免费商用,须署名):
  - 海:"Rubjerg Knude Fyr, Hjorring, Denmark, 1807072231, ako" by Ansgar Koreng
        https://commons.wikimedia.org/wiki/File:Rubjerg_Knude_Fyr,_Hj%C3%B8rring,_Denmark,_1807072231,_ako.jpg
  - 山:"Nebbia su colli e monti - Foreste Casentinesi - Appennino Tosco Emiliano - GT 01 - 2024 01 28" by Terragio67
        https://commons.wikimedia.org/wiki/File:Nebbia_su_colli_e_monti_-_Foreste_Casentinesi_-_Appennino_Tosco_Emiliano_-_GT_01_-_2024_01_28.jpg
  - 湖:"Llyn Ogwen Milky Way" by John Badham
        https://commons.wikimedia.org/wiki/File:Llyn_Ogwen_Milky_Way.jpg
-->
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Ccircle cx='32' cy='32' r='30' fill='%237b5ea7'/%3E%3Cpath d='M8 40 q8 -8 16 0 t16 0 t16 0' stroke='%23ffd9a0' stroke-width='4' fill='none' stroke-linecap='round'/%3E%3C/svg%3E">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    font-family: "Georgia", "KaiTi", "STKaiti", "SimSun", serif;
    overflow: hidden;
    background: #101632;
    color: #fff;
    cursor: crosshair;
  }

  /* ============ 场景层 ============ */
  .scenes, .scene { position: fixed; inset: 0; }
  .scene {
    opacity: 0;
    transition: opacity 1.6s ease;
    pointer-events: none;
  }
  .scene.on { opacity: 1; }
  .scene svg { position: absolute; width: 100%; }
  .scene img.bg {
    position: absolute; inset: 0; width: 100%; height: 100%;
    object-fit: cover;
    opacity: 0; transition: opacity 1.4s ease;
  }
  .scene img.bg.loaded { opacity: 1; }
  .scene::after {
    content: ""; position: absolute; inset: 0;
    background: linear-gradient(180deg, rgba(15,12,35,.40) 0%, rgba(15,12,35,.07) 34%, rgba(15,12,35,.05) 62%, rgba(10,8,28,.44) 100%);
  }

  /* ---- 黄昏的海 ---- */
  .s-sea { background: linear-gradient(180deg, #20265c 0%, #6b5aa0 34%, #b96f95 56%, #ff9a8b 72%, #ffd3a5 88%); }

  /* ---- 晨雾的山 ---- */
  .s-mtn { background: linear-gradient(180deg, #dce7f2 0%, #e7e3ea 40%, #f2dfcd 74%, #f6e8d4 100%); }

  /* ---- 星夜的湖 ---- */
  .s-lake { background: linear-gradient(180deg, #070d26 0%, #101c48 46%, #1c2f66 62%, #0d1738 63%, #0a1130 100%); }
  .firefly {
    position: absolute; width: 4px; height: 4px; border-radius: 50%;
    background: #ffe9a8; box-shadow: 0 0 8px 2px rgba(255,233,168,.6);
    opacity: .85;
    animation: wander 9s ease-in-out infinite alternate;
  }

  /* ---- 鸟 ---- */
  .bird {
    position: absolute;
    animation: flyaway 26s linear infinite;
    opacity: .8;
  }

  /* ============ 内容层 ============ */
  main {
    position: relative; z-index: 5;
    height: 100%;
    display: flex; flex-direction: column;
    align-items: center; justify-content: center;
    text-align: center;
    padding: 0 6vw 8vh;
    text-shadow: 0 1px 16px rgba(15,12,38,.62), 0 0 7px rgba(15,12,38,.5);
    transition: text-shadow 1s ease;
  }
  /* 文字区暗色光晕垫底:压住照片亮部,保证可读 */
  main::before {
    content: ""; position: absolute; z-index: -1;
    left: 50%; top: 50%;
    width: min(92vw, 920px); height: min(84vh, 740px);
    transform: translate(-50%, -50%);
    background: radial-gradient(ellipse at center, rgba(10,8,30,.58) 0%, rgba(10,8,30,.34) 45%, rgba(10,8,30,0) 72%);
    border-radius: 50%;
    filter: blur(12px);
    pointer-events: none;
  }
  .kicker {
    font-size: clamp(12px, 1.6vmin, 15px);
    letter-spacing: .42em; text-indent: .42em;
    text-transform: lowercase;
    color: rgba(255,255,255,.85);
    animation: rise 1.2s .2s ease both;
  }
  h1 {
    margin-top: 1.6vmin;
    font-family: "Georgia", "Palatino Linotype", serif;
    font-style: italic; font-weight: 400;
    font-size: clamp(52px, 12vmin, 110px);
    letter-spacing: .06em;
    color: #fff;
    animation: rise 1.2s .45s ease both;
  }
  .divider {
    margin: 2.6vmin 0 3.2vmin;
    font-size: clamp(13px, 2vmin, 18px);
    letter-spacing: .6em; text-indent: .6em;
    color: rgba(255,255,255,.75);
    animation: rise 1.2s .7s ease both;
  }
  .quote {
    font-size: clamp(17px, 3vmin, 24px);
    line-height: 2.15;
    color: rgba(255,255,255,.96);
    animation: rise 1.2s .95s ease both;
  }
  .lazy {
    margin-top: 1.6vmin;
    font-size: clamp(13px, 2.1vmin, 17px);
    line-height: 2.1;
    color: rgba(255,255,255,.78);
    animation: rise 1.2s 1.2s ease both;
  }
  #travel {
    margin-top: 4.6vmin;
    padding: 1.3vmin 3.4vmin;
    font: inherit;
    font-size: clamp(14px, 2.2vmin, 17px);
    letter-spacing: .18em; text-indent: .18em;
    color: #fff;
    background: rgba(255,255,255,.12);
    border: 1px solid rgba(255,255,255,.45);
    border-radius: 99px;
    backdrop-filter: blur(6px);
    -webkit-backdrop-filter: blur(6px);
    cursor: pointer;
    transition: background .5s, transform .35s, color 1s ease, border-color 1s ease;
    animation: rise 1.2s 1.45s ease both;
  }
  #travel:hover { background: rgba(255,255,255,.24); transform: translateY(-2px); }
  #travel:active { transform: translateY(0); }
  .scene-label {
    margin-top: 2.2vmin;
    font-size: clamp(11px, 1.7vmin, 14px);
    letter-spacing: .3em; text-indent: .3em;
    color: rgba(255,255,255,.6);
    animation: rise 1.2s 1.6s ease both;
    transition: opacity .4s;
  }
  footer {
    position: fixed; z-index: 5;
    left: 0; right: 0; bottom: 2.4vh;
    text-align: center;
    font-size: clamp(11px, 1.6vmin, 13px);
    letter-spacing: .22em; text-indent: .22em;
    color: rgba(255,255,255,.55);
    transition: color 1s ease;
  }
  footer a { color: inherit; text-decoration: none; border-bottom: 1px dotted rgba(255,255,255,.35); }

  /* 涟漪 */
  .ripple {
    position: fixed; z-index: 9;
    border: 1.5px solid rgba(255,255,255,.65);
    border-radius: 50%;
    pointer-events: none;
    animation: rip .9s ease-out forwards;
  }

  /* ============ 动画 ============ */
  @keyframes rise { from { opacity: 0; transform: translateY(18px); } to { opacity: 1; transform: none; } }
  @keyframes flyaway { from { transform: translateX(-12vw) translateY(0); } to { transform: translateX(105vw) translateY(-6vh); } }
  @keyframes wander {
    0% { transform: translate(0,0); opacity: .85; }
    35% { transform: translate(3.2vmin,-2.4vmin); opacity: .3; }
    70% { transform: translate(-2.4vmin,1.8vmin); opacity: .9; }
    100% { transform: translate(1.8vmin,3vmin); opacity: .4; }
  }
  @keyframes rip { from { width: 0; height: 0; opacity: .9; } to { width: 22vmin; height: 22vmin; opacity: 0; } }

  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { animation: none !important; transition: none !important; }
    .scene.on { opacity: 1; }
  }
</style>
</head>
<body data-scene="sea">

  <!-- 场景一:黄昏的海 -->
  <div class="scene s-sea on" id="scene-sea">
    <img class="bg" src="assets/sea.jpg" alt="黄昏时分的海岸与灯塔">
    <svg class="bird" style="top:22%; left:0" width="46" height="16" viewBox="0 0 46 16" fill="none">
      <path d="M2 12 Q8 4 14 11 M14 11 Q20 3 27 10 M27 10 Q33 4 44 12" stroke="rgba(40,30,70,.55)" stroke-width="2" stroke-linecap="round"/>
    </svg>
    <svg class="bird" style="top:12%; left:0; animation-delay:-13s; transform:scale(.7)" width="46" height="16" viewBox="0 0 46 16" fill="none">
      <path d="M2 12 Q8 4 14 11 M14 11 Q20 3 27 10 M27 10 Q33 4 44 12" stroke="rgba(40,30,70,.45)" stroke-width="2" stroke-linecap="round"/>
    </svg>
  </div>

  <!-- 场景二:晨雾的山 -->
  <div class="scene s-mtn" id="scene-mtn">
    <img class="bg" src="assets/mtn.jpg" alt="晨雾中的层叠群山">
  </div>

  <!-- 场景三:星夜的湖 -->
  <div class="scene s-lake" id="scene-lake">
    <img class="bg" src="assets/lake.jpg" alt="银河下的湖">
    <div class="firefly" style="left:20%; top:74%"></div>
    <div class="firefly" style="left:38%; top:82%; animation-delay:-3s"></div>
    <div class="firefly" style="left:64%; top:78%; animation-delay:-6s"></div>
    <div class="firefly" style="left:80%; top:86%; animation-delay:-8s"></div>
  </div>

  <!-- 内容 -->
  <main>
    <p class="kicker">a lazy corner of the world</p>
    <h1>vlovem</h1>
    <div class="divider">✦ ⌇ ✦</div>
    <p class="quote">这个人懒懒的,大学生一枚,<br>喜欢山川湖海,遨游四海。</p>
    <p class="lazy">偶尔做点小东西,更多时候在看云。<br>慢一点,也没关系。</p>
    <button id="travel">换个地方看看</button>
    <p class="scene-label" id="sceneLabel">此刻 · 黄昏的海</p>
  </main>

  <footer>
    <p>© yn400 · 本站很小,装得下四季</p>
  </footer>

<script>
(function () {
  var order = ["sea", "mtn", "lake"];
  var labels = { sea: "此刻 · 黄昏的海", mtn: "此刻 · 晨雾里的山", lake: "此刻 · 装满星星的湖" };
  var idx = 0, switching = false;

  var btn = document.getElementById("travel");
  var label = document.getElementById("sceneLabel");

  function show(i) {
    order.forEach(function (name, j) {
      document.getElementById("scene-" + name).classList.toggle("on", j === i);
    });
    document.body.dataset.scene = order[i];
    label.style.opacity = 0;
    setTimeout(function () {
      label.textContent = labels[order[i]];
      label.style.opacity = 1;
    }, 400);
  }

  btn.addEventListener("click", function (e) {
    e.stopPropagation();
    idx = (idx + 1) % order.length;
    show(idx);
  });

  // 点哪都有涟漪
  document.body.addEventListener("click", function (e) {
    var r = document.createElement("div");
    r.className = "ripple";
    var size = 2;
    r.style.left = (e.clientX - 1) + "px";
    r.style.top = (e.clientY - 1) + "px";
    document.body.appendChild(r);
    setTimeout(function () { r.remove(); }, 950);
  });

  // 背景图加载完成后淡入(加载前显示 CSS 渐变兜底)
  var bgs = document.querySelectorAll("img.bg");
  for (var i = 0; i < bgs.length; i++) {
    (function (img) {
      if (img.complete && img.naturalWidth > 0) {
        img.classList.add("loaded");
      } else {
        img.addEventListener("load", function () { img.classList.add("loaded"); });
      }
    })(bgs[i]);
  }
})();
</script>
</body>
</html>
